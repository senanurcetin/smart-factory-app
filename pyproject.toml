[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line too long) is noisy on embedded HTML/JS template strings and long
# JSON/string literals that black intentionally does not rewrap; black already
# enforces line length on actual code lines.
ignore = ["E501"]
