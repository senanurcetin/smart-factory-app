name: Feature request
description: Suggest an independently testable industrial-analytics improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the operator, analyst, or developer need, not just the implementation idea
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain inputs, outputs, and how the feature stays safe for a demo project
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Suggest measurable tests or expected outcomes
    validations:
      required: false
  - type: checkboxes
    id: data
    attributes:
      label: Research and safety boundary
      options:
        - label: This proposal does not require posting confidential production data or secrets.
          required: true
