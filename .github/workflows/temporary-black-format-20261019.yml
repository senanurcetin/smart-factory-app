# Single-purpose formatting job. Removes this workflow from the formatting commit.
name: Temporary Smart Factory Black normalization
on:
  push:
    branches:
      - fix/black-format-16-ci-20261019
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout formatting branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply pinned Black to exact CircleCI failing files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.5.1
          python -m black "tests/test_benchmark_snapshot_route.py" "analysis/benchmark_snapshot.py" "analysis/bigquery_cloud_read.py" "analysis/telemetry_monitor.py" "analysis/bigquery_plan.py" "tests/test_bigquery_plan.py" "tests/test_benchmark_snapshot.py" "analysis/bigquery_load_guard.py" "tests/test_stage_benchmarks.py" "analysis/source_registry.py" "tests/test_ai4i_batch.py" "analysis/fd001_batch.py" "tests/test_source_registry.py" "tests/test_model_registry.py" "tests/test_fd001_batch.py" "tests/test_e2e.py"
          python -m black --check .
          git rm ".github/workflows/temporary-black-format-20261019.yml"
          git add -- "tests/test_benchmark_snapshot_route.py" "analysis/benchmark_snapshot.py" "analysis/bigquery_cloud_read.py" "analysis/telemetry_monitor.py" "analysis/bigquery_plan.py" "tests/test_bigquery_plan.py" "tests/test_benchmark_snapshot.py" "analysis/bigquery_load_guard.py" "tests/test_stage_benchmarks.py" "analysis/source_registry.py" "tests/test_ai4i_batch.py" "analysis/fd001_batch.py" "tests/test_source_registry.py" "tests/test_model_registry.py" "tests/test_fd001_batch.py" "tests/test_e2e.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Black 26.5.1 to 16 CI-failing Python files"
          git push origin HEAD:fix/black-format-16-ci-20261019
