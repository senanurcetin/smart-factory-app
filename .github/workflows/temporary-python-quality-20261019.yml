# Temporary diagnostic replica of CircleCI's python-quality checks.
name: Temporary Python quality diagnostics
on:
  push:
    branches:
      - fix/black-format-16-ci-20261019
permissions:
  contents: read
jobs:
  python-quality-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff static lint
        run: ruff check .
      - name: Black formatting
        run: black --check .
      - name: Compile Python
        run: python -m compileall -q main.py case_study.py rul_case_study.py layout.py settings.py analysis tests
      - name: Verify committed offline artifacts
        run: python scripts/verify_ci_artifacts.py
      - name: Generate offline visual assets and SQL analysis
        run: |
          python analysis/generate_eda.py
          python analysis/generate_visuals.py
          python analysis/sql_queries.py
          python analysis/generate_cmapss_visuals.py
      - name: Offline Python test suite matching CircleCI
        run: |
          failed=0
          for test_file in test_artifacts test_container_contract test_model_registry test_ci_heredoc_safety test_batch_quality test_source_registry test_bigquery_plan test_ai4i_batch test_fd001_batch test_bigquery_load_guard test_benchmark_snapshot test_benchmark_snapshot_route test_stage_benchmarks test_bigquery_cloud_read test_kaggle_parity test_telemetry_ingestion test_telemetry_monitor test_case_study test_dashboard_model test_dashboard_reporting test_drift_check test_rul_input_contract test_rul_artifacts test_rul_case_study test_settings test_seo_public; do
            python -m unittest discover -s tests -p "${test_file}.py" -v || failed=1
          done
          exit "$failed"
      - name: Import Flask app
        run: python -c "import main; print(main.app.name)"
