name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Syntax check
        run: |
          python -m py_compile main.py case_study.py
          python -m py_compile analysis/run_ai4i_case_study.py
          python -m py_compile analysis/generate_visuals.py
          python -m py_compile analysis/generate_eda.py
          python -m py_compile analysis/sql_queries.py

      - name: Generate EDA assets
        run: python analysis/generate_eda.py

      - name: Generate analysis visuals
        run: python analysis/generate_visuals.py

      - name: Run SQL analysis
        run: python analysis/sql_queries.py

      - name: Artifact and metrics contract tests
        run: python -m unittest discover -s tests -p "test_artifacts.py" -v

      - name: Route and integration tests
        run: python -m unittest discover -s tests -p "test_case_study.py" -v

      - name: Dashboard <-> real model integration tests
        run: python -m unittest discover -s tests -p "test_dashboard_model.py" -v

      - name: Import app
        run: python -c "import main; print(main.app.name)"
