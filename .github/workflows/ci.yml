name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py case_study.py
          python -m py_compile analysis/run_ai4i_case_study.py
          python -m py_compile analysis/generate_visuals.py

      - name: Generate visualization assets
        run: python analysis/generate_visuals.py

      - name: Artifact + metrics contract tests
        run: python -m unittest discover -s tests -p "test_artifacts.py" -v

      - name: Route + integration tests
        run: python -m unittest discover -s tests -p "test_case_study.py" -v

      - name: Import app
        run: python -c "import main; print(main.app.name)"
