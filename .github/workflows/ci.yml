name: CI

# Automatic source/test verification is performed by CircleCI.
# GitHub-hosted runner minutes are exhausted; manual opt-in only.
on:
  workflow_dispatch:

jobs:
  quality:
    if: vars.ENABLE_GITHUB_ACTIONS_CI == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Syntax check
        run: |
          python -m py_compile main.py case_study.py rul_case_study.py layout.py settings.py
          python -m py_compile analysis/run_ai4i_case_study.py
          python -m py_compile analysis/generate_visuals.py
          python -m py_compile analysis/generate_eda.py
          python -m py_compile analysis/sql_queries.py
          python -m py_compile analysis/run_cmapss_rul_case_study.py
          python -m py_compile analysis/generate_cmapss_visuals.py
          python -m py_compile analysis/check_drift.py

      # Deterministic CI: production-ready model artifacts and reports are
      # versioned. Retraining from external data is a separate manual workflow.
      # This keeps PR checks independent of UCI/NASA TLS and availability.
      - name: Verify committed model and metrics artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files = [
              "analysis/artifacts/model.pkl",
              "analysis/artifacts/rul_model.pkl",
              "docs/data/ai4i-case-study/summary.json",
              "docs/data/cmapss-rul-case-study/summary.json",
              "docs/data/ai4i-case-study/drift-report.json",
          ]
          for name in files:
              file = Path(name)
              if not file.is_file() or not file.stat().st_size:
                  raise SystemExit(f"Missing or empty committed artifact: {name}")
              if file.suffix == ".json":
                  json.loads(file.read_text(encoding="utf-8"))
              print(f"OK: {name}")
          PY

      - name: Generate EDA assets
        run: python analysis/generate_eda.py

      - name: Generate analysis visuals
        run: python analysis/generate_visuals.py

      - name: Run SQL analysis
        run: python analysis/sql_queries.py

      - name: Generate C-MAPSS RUL visuals
        run: python analysis/generate_cmapss_visuals.py

      - name: Artifact and metrics contract tests
        run: python -m unittest discover -s tests -p "test_artifacts.py" -v

      - name: Route and integration tests
        run: python -m unittest discover -s tests -p "test_case_study.py" -v

      - name: Dashboard <-> real model integration tests
        run: python -m unittest discover -s tests -p "test_dashboard_model.py" -v

      - name: Drift check tests
        run: python -m unittest discover -s tests -p "test_drift_check.py" -v

      - name: RUL artifact and metrics contract tests
        run: python -m unittest discover -s tests -p "test_rul_artifacts.py" -v

      - name: RUL route and integration tests
        run: python -m unittest discover -s tests -p "test_rul_case_study.py" -v

      - name: Settings route and model-card tests
        run: python -m unittest discover -s tests -p "test_settings.py" -v

      - name: Import app
        run: python -c "import main; print(main.app.name)"

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Real-browser smoke tests (all 4 routes)
        run: python -m unittest discover -s tests -p "test_e2e.py" -v

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t smart-factory-app:ci .

      - name: Runtime smoke test (start container, verify it actually serves traffic)
        run: |
          docker run -d --name smoke -p 8080:8080 smart-factory-app:ci

          ready=""
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/data > response.json; then
              ready="1"
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "Container never became ready on /api/data"
            docker logs smoke
            docker rm -f smoke
            exit 1
          fi

          if ! grep -q "RiskScore" response.json; then
            echo "Response from /api/data is missing RiskScore:"
            cat response.json
            docker logs smoke
            docker rm -f smoke
            exit 1
          fi

          echo "Smoke test passed:"
          cat response.json
          docker logs smoke
          docker rm -f smoke
